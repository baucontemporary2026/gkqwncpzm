<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>밴드 합주 일정 조율 (Band Practice Scheduler)</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">

  <style>
    :root {
      --ios-bg: #f2f2f7;
      --ios-card: #ffffff;
      --ios-blue: #007aff;
      --ios-green: #34c759;
      --ios-red: #ff3b30;
      --ios-gray: #8e8e93;
      --ios-light-gray: #e5e5ea;
      --ios-secondary-bg: #f8f8fb;
      --ios-border: #e0e0e8;
      --ios-radius: 14px;
      --ios-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      padding: 0;
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--ios-bg);
      color: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 40px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 18px;
    }

    .brand-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #007aff, #5856d6);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: white;
    }

    .container {
      width: 100%;
      max-width: 600px;
      padding: 16px;
    }

    .ios-card {
      background: var(--ios-card);
      border-radius: var(--ios-radius);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--ios-shadow);
      border: 1px solid var(--ios-border);
    }

    .ios-title { font-size: 19px; font-weight: 700; margin-bottom: 6px; }
    .ios-sub { color: var(--ios-gray); font-size: 13px; margin-bottom: 16px; }

    label { font-size: 12px; font-weight: 600; color: var(--ios-gray); margin-bottom: 6px; display: block; }
    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--ios-border);
      border-radius: 10px;
      font-size: 14px;
      background: var(--ios-secondary-bg);
      margin-bottom: 12px;
      outline: none;
    }

    .ios-btn {
      width: 100%;
      background: var(--ios-blue);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .ios-btn-secondary {
      background: #e5e5ea;
      color: #000;
    }

    .grid-container {
      overflow-x: auto;
      border-radius: 10px;
      border: 1px solid var(--ios-border);
    }

    table.time-grid {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      font-size: 12px;
    }

    table.time-grid th, table.time-grid td {
      border: 1px solid var(--ios-border);
      padding: 6px 2px;
      min-width: 44px;
      height: 36px;
    }

    .slot-cell.selected {
      background-color: var(--ios-blue) !important;
      color: white;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">🎸</div>
      <span>밴드 합주 조율</span>
    </div>
  </header>

  <div class="container">
    <div class="ios-card">
      <h2 class="ios-title">가능 시간 텍스트 입력</h2>
      <div class="ios-sub">요청하신 형태로 텍스트를 적어주시면 표로 자동 변환됩니다.</div>

      <textarea id="text-schedule-input" rows="7" placeholder="입력 예시:
23: o
24: 13~15 x
25: ~11 12~13 17~"></textarea>

      <button class="ios-btn ios-btn-secondary" onclick="parseTextToGrid()">표에 반영하기</button>
    </div>

    <div class="ios-card">
      <h3 class="ios-title">시간표 확인</h3>
      <div class="grid-container">
        <table class="time-grid">
          <thead><tr id="grid-header-row"></tr></thead>
          <tbody id="grid-body-rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const START_HOUR = 0;
    const END_HOUR = 24;
    let selectedSlots = new Set();

    function getDates() {
      const dates = [];
      const today = new Date();
      for(let i=0; i<7; i++) {
        const d = new Date();
        d.setDate(today.getDate() + i);
        dates.push(d);
      }
      return dates;
    }

    function formatDateStr(d) {
      return d.toISOString().split('T')[0];
    }

    function renderGrid() {
      const dates = getDates();
      const headerRow = document.getElementById('grid-header-row');
      const bodyRows = document.getElementById('grid-body-rows');

      let hHtml = '<th>시간</th>';
      dates.forEach(d => {
        hHtml += `<th>${d.getMonth()+1}/${d.getDate()}</th>`;
      });
      headerRow.innerHTML = hHtml;

      let bHtml = '';
      for (let h = START_HOUR; h < END_HOUR; h++) {
        bHtml += `<tr><th>${h}:00</th>`;
        dates.forEach(d => {
          const dateKey = formatDateStr(d);
          const slotId = `${dateKey}_${h}`;
          const isSelected = selectedSlots.has(slotId);
          bHtml += `<td class="slot-cell ${isSelected ? 'selected' : ''}">${isSelected ? '가능' : '-'}</td>`;
        });
        bHtml += '</tr>';
      }
      bodyRows.innerHTML = bHtml;
    }

    // 요청하신 파싱 규칙 완벽 적용
    function parseTextToGrid() {
      const text = document.getElementById('text-schedule-input').value;
      const lines = text.split('\n');
      const dates = getDates();

      lines.forEach(line => {
        const trimmed = line.trim();
        if (!trimmed) return;

        const dateMatch = trimmed.match(/^(\d{1,2})(?:일)?\s*[:\-]?\s*(.*)$/i);
        if (!dateMatch) return;

        const dayNum = parseInt(dateMatch[1]);
        const ruleStr = dateMatch[2].trim().toLowerCase();

        const targetDateObj = dates.find(d => d.getDate() === dayNum);
        if (!targetDateObj) return;

        const dateKey = formatDateStr(targetDateObj);

        // 1) 23: o (전체 가능)
        if (/^(o|O|전체|가능)$/i.test(ruleStr)) {
          for (let h = START_HOUR; h < END_HOUR; h++) {
            selectedSlots.add(`${dateKey}_${h}`);
          }
          return;
        }

        // 2) 13~15 x (특정 시간만 제외)
        const isExclusion = ruleStr.includes('x') || ruleStr.includes('제외');
        if (isExclusion) {
          for (let h = START_HOUR; h < END_HOUR; h++) {
            selectedSlots.add(`${dateKey}_${h}`);
          }
          const rangeMatches = ruleStr.matchAll(/(\d{1,2})\s*[~\-]\s*(\d{1,2})/g);
          for (const rm of rangeMatches) {
            const exStart = parseInt(rm[1]);
            const exEnd = parseInt(rm[2]);
            for (let h = exStart; h < exEnd; h++) {
              selectedSlots.delete(`${dateKey}_${h}`);
            }
          }
          return;
        }

        // 3) ~11, 12~13, 17~ (복합 시간 구문)
        const tokens = ruleStr.split(/[\s,]+/);
        tokens.forEach(token => {
          if (!token) return;

          // ~11 (11시 이전)
          if (/^[~\-]\d{1,2}$/.test(token)) {
            const endH = parseInt(token.replace(/[~\-]/, ''));
            for (let h = START_HOUR; h < endH; h++) {
              selectedSlots.add(`${dateKey}_${h}`);
            }
          }
          // 17~ (17시 이후)
          else if (/^\d{1,2}[~\-]$/.test(token)) {
            const startH = parseInt(token.replace(/[~\-]/, ''));
            for (let h = startH; h < END_HOUR; h++) {
              selectedSlots.add(`${dateKey}_${h}`);
            }
          }
          // 12~13 (구간 지정)
          else if (/^\d{1,2}[~\-]\d{1,2}$/.test(token)) {
            const parts = token.split(/[~\-]/);
            const startH = parseInt(parts[0]);
            const endH = parseInt(parts[1]);
            for (let h = startH; h < endH; h++) {
              selectedSlots.add(`${dateKey}_${h}`);
            }
          }
        });
      });

      renderGrid();
      alert('텍스트 규칙이 적용되어 시간표가 변경되었습니다.');
    }

    renderGrid();
  </script>
</body>
</html>
